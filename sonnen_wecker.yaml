
blueprint:
  name: Sunrise Light Simulator (Alarm Entity Support)
  description: >
    Gradually brighten lights and change color to simulate a natural sunrise.
    Supports a fixed alarm time, a timestamp entity, or an input_datetime
    entity. The sunrise starts Duration minutes before the alarm time.
  domain: automation

  input:
    target_lights:
      name: Lights
      description: >
        Select lights by entity, area, device, or label.
        Manual-off detection checks the first selected entity only.
      selector:
        target: {}

    alarm_source:
      name: Alarm Time or Entity
      description: >
        Enter a fixed time (07:00:00) or an entity ID containing the
        next alarm timestamp, e.g. sensor.phone_next_alarm, or an
        input_datetime entity.
      default: "07:00:00"
      selector:
        text: {}

    duration:
      name: Duration (minutes)
      description: How long before the alarm the sunrise starts.
      default: 45
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minutes

    days_of_week:
      name: Days of Week (Optional)
      default: []
      selector:
        select:
          options:
            - label: Monday
              value: "mon"
            - label: Tuesday
              value: "tue"
            - label: Wednesday
              value: "wed"
            - label: Thursday
              value: "thu"
            - label: Friday
              value: "fri"
            - label: Saturday
              value: "sat"
            - label: Sunday
              value: "sun"
          multiple: true

    presence_entities:
      name: Presence Check Entities (Optional)
      default: []
      selector:
        entity:
          multiple: true

    presence_state:
      name: Required Presence State
      default: "home"
      selector:
        text: {}

    presence_logic:
      name: Presence Match Logic
      default: "any"
      selector:
        select:
          options:
            - label: "Any - at least one entity matches"
              value: "any"
            - label: "All - every entity matches"
              value: "all"

    startup_brightness:
      name: Startup Brightness (%)
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    max_brightness:
      name: Maximum Brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    start_color_temp:
      name: Starting Color Temperature
      default: "2000"
      selector:
        select:
          options:
            - label: "Candlelight (1800K)"
              value: "1800"
            - label: "Warm White (2000K)"
              value: "2000"
            - label: "Soft White (2700K)"
              value: "2700"
            - label: "Neutral (3000K)"
              value: "3000"
          custom_value: true

    end_color_temp:
      name: Ending Color Temperature
      default: "5500"
      selector:
        select:
          options:
            - label: "Neutral (3000K)"
              value: "3000"
            - label: "Cool White (4000K)"
              value: "4000"
            - label: "Daylight (5000K)"
              value: "5000"
            - label: "Bright Daylight (5500K)"
              value: "5500"
            - label: "Bright Cool Daylight (6500K)"
              value: "6500"
          custom_value: true

    step_interval:
      name: Step Interval (seconds)
      default: 30
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds

    pre_sunrise_actions:
      name: Pre-Sunrise Actions (Optional)
      default: []
      selector:
        action: {}

    post_sunrise_actions:
      name: Post-Sunrise Actions (Optional)
      default: []
      selector:
        action: {}

    auto_off_minutes:
      name: Auto-Off Timeout (Optional)
      default: 0
      selector:
        number:
          min: 0
          max: 240
          step: 5
          unit_of_measurement: minutes

variables:
  alarm_source: !input alarm_source
  duration: !input duration
  max_brightness: !input max_brightness
  step_interval: !input step_interval
  startup_brightness: !input startup_brightness
  days_of_week: !input days_of_week
  start_color_temp: !input start_color_temp
  end_color_temp: !input end_color_temp
  presence_entities: !input presence_entities
  presence_state: !input presence_state
  presence_logic: !input presence_logic
  auto_off_minutes: !input auto_off_minutes
  target_lights: !input target_lights

  total_steps: >
    {{ [1, ((duration | int * 60) / (step_interval | int))
       | round(0, 'ceil') | int] | max }}

  start_kelvin: "{{ start_color_temp | int(2000) }}"
  end_kelvin: "{{ end_color_temp | int(5500) }}"

  monitor_entity: >
    {% set ids = target_lights.get('entity_id', []) %}
    {% if ids is string %}
      {{ ids }}
    {% elif ids | length > 0 %}
      {{ ids[0] }}
    {% else %}
      none
    {% endif %}

  light_is_on: >
    {{ monitor_entity != 'none' and is_state(monitor_entity, 'on') }}

  effective_start_brightness: >
    {% if light_is_on and state_attr(monitor_entity, 'brightness') is not none %}
      {{ [
        (state_attr(monitor_entity, 'brightness') / 255 * 100) | round(0) | int,
        max_brightness | int
      ] | min }}
    {% else %}
      {{ startup_brightness | int }}
    {% endif %}

  alarm_timestamp: >
    {% set source = alarm_source | string | trim %}
    {% set entity_value = states(source) %}
    {% if entity_value not in ['unknown', 'unavailable', 'none', ''] %}
      {% set alarm_value = entity_value | trim %}
    {% else %}
      {% set alarm_value = source %}
    {% endif %}

    {% if alarm_value | is_number %}
      {{ alarm_value | float }}
    {% elif ':' in alarm_value
          and '-' not in alarm_value
          and 'T' not in alarm_value
          and alarm_value | length <= 8 %}
      {% set parsed = as_timestamp(
        now().strftime('%Y-%m-%d') ~ ' ' ~ alarm_value, 0
      ) %}
      {% if parsed <= as_timestamp(now()) %}
        {{ parsed + 86400 }}
      {% else %}
        {{ parsed }}
      {% endif %}
    {% else %}
      {{ as_timestamp(alarm_value, 0) }}
    {% endif %}

trigger:
  - platform: time_pattern
    seconds: "/10"

condition:
  - condition: template
    value_template: >
      {{ days_of_week | length == 0
         or now().strftime('%a').lower()[:3] in days_of_week }}

  - condition: template
    value_template: >
      {{ presence_entities | length == 0
         or (
           presence_logic == 'all'
           and presence_entities
             | reject('is_state', presence_state)
             | list | length == 0
         )
         or (
           presence_logic != 'all'
           and presence_entities
             | select('is_state', presence_state)
             | list | length > 0
         ) }}

  - condition: template
    value_template: >
      {% set alarm_ts = alarm_timestamp | float(0) %}
      {% set start_ts = alarm_ts - (duration | int * 60) %}
      {% set now_ts = as_timestamp(now()) %}
      {{ alarm_ts > 0
         and now_ts >= start_ts
         and now_ts < start_ts + 10 }}

action:
  - choose: []
    default: !input pre_sunrise_actions

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not light_is_on }}"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              brightness_pct: "{{ startup_brightness | int }}"
              color_temp_kelvin: "{{ start_kelvin | int }}"
            continue_on_error: true

          - delay:
              seconds: 2
    default: []

  - repeat:
      while:
        - condition: template
          value_template: "{{ repeat.index <= total_steps | int }}"

        - condition: template
          value_template: >
            {{ monitor_entity == 'none'
               or is_state(monitor_entity, 'on') }}

      sequence:
        - action: light.turn_on
          target: !input target_lights
          data:
            brightness_pct: >
              {{
                (
                  effective_start_brightness | float
                  + (
                    (max_brightness | float
                     - effective_start_brightness | float)
                    * ((repeat.index / (total_steps | int)) ** 1.3)
                  )
                ) | round(0) | int
              }}
            color_temp_kelvin: >
              {{
                (
                  start_kelvin | float
                  + (
                    (end_kelvin | float - start_kelvin | float)
                    * (
                      1
                      - (
                        1 - repeat.index / (total_steps | int)
                      ) ** 1.5
                    )
                  )
                ) | round(0) | int
              }}
            transition: "{{ step_interval | int }}"
          continue_on_error: true

        - delay:
            seconds: "{{ step_interval | int }}"

  - if:
      - condition: template
        value_template: >
          {{ monitor_entity == 'none'
             or is_state(monitor_entity, 'on') }}
    then:
      - action: light.turn_on
        target: !input target_lights
        data:
          brightness_pct: "{{ max_brightness | int }}"
          color_temp_kelvin: "{{ end_kelvin | int }}"
          transition: 2
        continue_on_error: true

      - choose: []
        default: !input post_sunrise_actions

      - if:
          - condition: template
            value_template: "{{ auto_off_minutes | int(0) > 0 }}"
        then:
          - delay:
              minutes: "{{ auto_off_minutes | int }}"

          - action: light.turn_off
            target: !input target_lights
            continue_on_error: true

mode: single
max_exceeded: silent
